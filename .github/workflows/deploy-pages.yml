name: Deploy GEMOK dashboard

on:
  push:
    branches: [main]
    paths:
      - "dist/**"
      - "site/index.html"
      - "site/data-recovery.json"
      - "site/protect-dashboard-data.mjs"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "github-pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out dashboard source
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Apply canonical dashboard UI
        run: cp site/index.html dist/index.html
      - name: Protect historical dashboard data
        run: node site/protect-dashboard-data.mjs
      - name: Upload dashboard files
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy dashboard
        id: deployment
        uses: actions/deploy-pages@v4
