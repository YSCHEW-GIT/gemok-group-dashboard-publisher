name: Deploy GEMOK dashboard

on:
  push:
    branches: [main]
    paths:
      - "dist/**"
      - "site/index.html"
      - "site/canonical-index.html"
      - "site/assets/**"
      - "site/data-recovery.json"
      - "site/protect-dashboard-data.mjs"
      - "site/test-sales-breakdown.mjs"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

jobs:
  coalesce:
    runs-on: ubuntu-latest
    outputs:
      should_deploy: ${{ steps.latest.outputs.should_deploy }}
    steps:
      - name: Wait for related dashboard commits
        if: github.event_name == 'push'
        run: sleep 90
      - name: Use only the latest main branch commit
        id: latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest_sha="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_REF_NAME}" --jq '.sha')"
          if [[ "${GITHUB_SHA}" == "${latest_sha}" ]]; then
            echo "should_deploy=true" >> "${GITHUB_OUTPUT}"
            echo "This is the latest commit; continuing with one consolidated deployment."
          else
            echo "should_deploy=false" >> "${GITHUB_OUTPUT}"
            echo "A newer commit ${latest_sha} exists; this deployment is superseded."
          fi

  build:
    needs: coalesce
    if: needs.coalesce.outputs.should_deploy == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out dashboard source
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Apply canonical dashboard UI
        run: |
          cp site/canonical-index.html dist/index.html
          mkdir -p dist/assets
          cp -a site/assets/. dist/assets/
      - name: Preserve inventory keyword input alignment
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const file = 'dist/index.html';
          const html = fs.readFileSync(file, 'utf8').replace(
            '.inventory-filter-control > span,.inventory-stock-range legend',
            '.inventory-filter-control > span:first-child,.inventory-stock-range legend'
          );
          const withoutLocations = html
            .replaceAll('<em>${escapeHtml(`${copy.location}: ${row.location || copy.noLocation}`)}</em>', '')
            .replace('[copy.code,copy.details,copy.storeLocation,copy.stock,copy.cost,copy.price]', '[copy.code,copy.details,copy.store,copy.stock,copy.cost,copy.price]');
          fs.writeFileSync(file, withoutLocations);
          JS
      - name: Protect historical dashboard data
        run: node site/protect-dashboard-data.mjs
      - name: Validate direct sales breakdown
        run: node site/test-sales-breakdown.mjs
      - name: Upload dashboard files
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Wait for Pages artifact visibility
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          stable_checks=0
          for attempt in $(seq 1 12); do
            artifact_id="$(gh api \
              "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?name=github-pages" \
              --jq '.artifacts[] | select(.expired == false) | .id' \
              2>/dev/null || true)"
            if [[ "${artifact_id}" =~ ^[0-9]+$ ]]; then
              stable_checks=$((stable_checks + 1))
              echo "github-pages artifact is visible (${stable_checks}/2 stable checks)."
              if (( stable_checks >= 2 )); then
                break
              fi
            else
              stable_checks=0
              echo "Artifact is not visible yet (${attempt}/12)."
            fi
            sleep 5
          done
          if (( stable_checks < 2 )); then
            echo "::error::github-pages artifact was not stably visible within 60 seconds."
            exit 1
          fi
      - name: Allow Pages artifact metadata to stabilize
        run: sleep 10

  deploy:
    needs: build
    if: needs.build.result == 'success'
    concurrency:
      group: "github-pages"
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy dashboard
        id: deployment
        uses: actions/deploy-pages@v4
